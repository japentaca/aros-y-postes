<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001428"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <g filter="url(#softglow)" opacity="0.6">
    <circle cx="32" cy="32" r="22" fill="none" stroke="#44aaff" stroke-width="1"/>
  </g>
  <g filter="url(#glow)">
    <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#7ad8ff" stroke-width="4"/>
    <ellipse cx="32" cy="32" rx="22" ry="9" fill="none" stroke="#e8f8ff" stroke-width="1.5"/>
  </g>
  <circle cx="49" cy="28" r="3" fill="#e8f8ff" filter="url(#glow)"/>
</svg>
